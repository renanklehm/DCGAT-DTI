name: dcgatdti

channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip
  - setuptools=68.0.0
  - pytorch=2.1.1
  - torchvision=0.16.1
  - torchaudio=2.1.1
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas=2.2
  - pyarrow
  - scipy=1.11
  - scikit-learn=1.2
  - matplotlib
  - tqdm
  - pyyaml
  - rdkit
  - openbabel
  - biopython=1.81
  - datasets=2.14.6
  - transformers=4.32.1
  - tokenizers=0.13.3
  - huggingface_hub=0.19.4
  - lightning=2.6.5
  - pytorch-lightning=2.6.5
  - torchmetrics=1.2.1
  - hf_transfer=0.1.9
  - pip:
      - antlr4-python3-runtime==4.9.3
      - fair-esm==2.0.0
      - neo4j>=5.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - ray[tune]==2.8.1
      - --find-links https://data.pyg.org/whl/torch-2.1.0+cu121.html
      - pyg_lib
      - torch_scatter
      - torch_sparse
      - torch_cluster
      - torch_spline_conv
      - torch-geometric==2.4.0
